[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dstcron"
version = "0.1.0"
description = "Find cron schedules that silently skip, shift, or double-fire across daylight-saving transitions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Md Rashedul Hasan"}]

[project.scripts]
dstcron = "dstcron.cli:main"

[tool.setuptools]
packages = ["dstcron"]
